name: Generate Snake Animation
on:
  schedule: [cron: "0 0 * * *"]
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Debug - Show current directory
        run: |
          echo "Текущая директория:"
          pwd
          ls -la

      - name: Generate snake.svg
        uses: Platane/snk@v3.2.0  # Используем фиксированную версию
        id: snake
        with:
          github_user_name: "Gabryelf"  # В кавычках и точно ваше имя
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Debug - Check generated files
        run: |
          echo "Содержимое после генерации:"
          ls -la
          echo "Проверяем наличие svg файлов..."
          find . -name "*.svg" -type f

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./  # Публикуем из корня
          publish_branch: output
          keep_files: false  # Изменено с true
